services:
  db:
    image: postgres:16
    container_name: hpgmf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hpgmf
      POSTGRES_PASSWORD: hpgmf123
      POSTGRES_DB: hpgmf
    ports:
      - "5435:5432"
    volumes:
      - hpgmf_data:/var/lib/postgresql/data

volumes:
  hpgmf_data: